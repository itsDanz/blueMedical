version: "3.9"

services:
  backend:
    build:
      context: ./backend
      target: prod
    container_name: app-backend
    environment:
      - PORT=3000
      - NODE_ENV=production
      - EXTERNAL_API_URL=${EXTERNAL_API_URL:-https://687eade4efe65e5200875629.mockapi.io/api/v1/posts}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    container_name: app-frontend
    environment:
      - VITE_API_BASE_URL=http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
